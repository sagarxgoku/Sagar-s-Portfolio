<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Message Sent — Sagar Sharma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e12;
    --bg-elev:#15171d;
    --surface:#1c1f27;
    --border:#2a2e38;
    --text:#f3f1ec;
    --muted:#9a9da8;
    --accent:#ff5d3a;
    --accent-soft:rgba(255,93,58,0.14);
    --accent2:#4ecdc4;
    --accent2-soft:rgba(78,205,196,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    overflow:hidden;
  }
  .bg-grid{
    position:fixed;
    inset:0;
    z-index:-2;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 40%, black 0%, transparent 70%);
  }
  .bg-glow{
    position:fixed;
    top:-220px;right:-180px;
    width:560px;height:560px;
    background:radial-gradient(circle, var(--accent-soft), transparent 70%);
    z-index:-1; filter:blur(10px);
  }
  .bg-glow2{
    position:fixed;
    bottom:-260px;left:-200px;
    width:560px;height:560px;
    background:radial-gradient(circle, var(--accent2-soft), transparent 70%);
    z-index:-1; filter:blur(10px);
  }
  .card{
    max-width:460px;
  }
  .check{
    width:64px;height:64px;
    margin:0 auto 28px;
    border-radius:50%;
    background:var(--accent2-soft);
    border:1px solid var(--accent2);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent2);
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(1.8rem,5vw,2.6rem);
    font-weight:600;
    letter-spacing:-0.02em;
    margin-bottom:14px;
  }
  h1 span{
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  p{
    color:var(--muted);
    font-size:1.02rem;
    margin-bottom:34px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 28px;
    border-radius:999px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    background:var(--accent);
    color:#15171d;
    text-decoration:none;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px -8px var(--accent);
  }
  .mono{
    display:block;
    margin-top:28px;
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    color:var(--muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  a:focus-visible,.btn:focus-visible{
    outline:2px solid var(--accent2);
    outline-offset:3px;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<div class="card">
  <div class="check">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>
  <h1>Message <span>sent</span></h1>
  <p>Thanks for reaching out — your message has landed in my inbox. I'll get back to you as soon as I can.</p>
  <a href="index.html" class="btn">Back to portfolio</a>
  <span class="mono">Sagar Sharma · Lucknow</span>
</div>
</body>
</html>
